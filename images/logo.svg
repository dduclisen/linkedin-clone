<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A66C2" />
      <stop offset="100%" stop-color="#004182" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
  </defs>

  <!-- Rounded App Tile -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- "T" + Briefcase/Network Icon Motif -->
  <g transform="translate(0, 0)">
    <!-- Briefcase Handle / Top Arch -->
    <path d="M196 150 C196 128, 212 112, 234 112 L278 112 C300 112, 316 128, 316 150 L316 170 L196 170 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" />

    <!-- Main Briefcase Body / Shield Base -->
    <rect x="120" y="170" width="272" height="210" rx="36" fill="#FFFFFF" />

    <!-- Stylized 'T' Cutout / Accent Motif -->
    <path d="M160 220 L352 220 L352 260 L280 260 L280 340 L232 340 L232 260 L160 260 Z" 
          fill="url(#accentGrad)" />

    <!-- Connection / Network Dots -->
    <circle cx="180" cy="300" r="16" fill="#0A66C2" />
    <circle cx="332" cy="300" r="16" fill="#0A66C2" />
  </g>
</svg>
